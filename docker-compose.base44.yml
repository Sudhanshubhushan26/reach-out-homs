services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: reachout_homs
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: reachout_homs
      CORS_ORIGINS: "*"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn server:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      REACT_APP_BACKEND_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      HOST: 0.0.0.0
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: bash -c "yarn install && yarn start"

volumes:
  mongo_data:
  frontend_node_modules:
