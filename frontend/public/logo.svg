<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Dark navy outer background -->
  <circle cx="300" cy="300" r="300" fill="#0B1E3D"/>
  <!-- White inner disc -->
  <circle cx="300" cy="300" r="278" fill="#FFFFFF"/>
  <!-- Inner blue rings -->
  <circle cx="300" cy="300" r="265" fill="none" stroke="#1E40AF" stroke-width="3"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="#1E40AF" stroke-width="3"/>

  <!-- Defs for curved text paths -->
  <defs>
    <path id="topArc" d="M 70 300 A 230 230 0 0 1 530 300" fill="none"/>
    <path id="botArc" d="M 70 300 A 230 230 0 0 0 530 300" fill="none"/>
    <path id="botInnerLeft" d="M 80 320 A 220 220 0 0 0 520 320" fill="none"/>
  </defs>

  <!-- "Reach Out" top arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1E3A8A" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">Reach Out</textPath>
  </text>

  <!-- "An initiative of Sir Ganga Ram Trust Society" bottom arc -->
  <text font-family="Georgia, serif" font-size="26" font-weight="700" fill="#DC2626" letter-spacing="1">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">An initiative of Sir Ganga Ram Trust Society</textPath>
  </text>

  <!-- "Care At Your Doorstep" inner bottom arc -->
  <text font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1E40AF" letter-spacing="1">
    <textPath href="#botInnerLeft" startOffset="50%" text-anchor="middle">Care At Your Doorstep</textPath>
  </text>

  <!-- Stylized human figure: orange head + teal V-arms -->
  <!-- Head -->
  <circle cx="300" cy="220" r="32" fill="#EA580C"/>
  <!-- Body: orange V (arms up) -->
  <path d="M 300 260 L 240 350 L 270 380 L 300 330 L 330 380 L 360 350 Z" fill="#EA580C"/>
  <!-- Outer teal V wings -->
  <path d="M 300 285 L 215 410 L 250 440 L 300 360 L 350 440 L 385 410 Z" fill="#0F766E"/>
  <!-- Tail / trunk -->
  <path d="M 285 360 L 285 460 L 315 460 L 315 360 Z" fill="#0F766E"/>

  <!-- "SIR GANGA RAM HOSPITAL" -->
  <text x="300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#111827" letter-spacing="1.5">SIR GANGA RAM HOSPITAL</text>
  <!-- "Trust of Generations" -->
  <text x="300" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">Trust of Generations</text>
</svg>
